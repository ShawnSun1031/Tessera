[project]
name = "tessera"
version = "0.1.0"
description = "Team web platform for annotating images in Label Studio and training, reviewing and running Ultralytics YOLO models."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "label-studio-sdk>=2.0.19",
    "onnx>=1.12.0,<2.0.0",
    "onnxruntime-gpu>=1.31.0",
    "onnxslim>=0.1.82",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "ultralytics>=8.4.189",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff.lint]
preview = true
select = ["E", "F", "ANN"]
ignore = ["F401"]
